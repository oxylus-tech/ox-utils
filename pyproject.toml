[project]
name = "ox-utils"
description = "Django and python utilities."
readme = "README.rst"
license = "GPL-3.0-or-later"
version = "0.0.1"
authors = [{ name="Thomas Baquet", email="thomas@oxylus.app" }]


# dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",

    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
files = [
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "python-magic>=0.4.27",
]
caps = [
    "django-caps>=0.0.3",
]
jwt = [
    "pyjwt>=2.15.1",
]

#[project.scripts]
#ox-orch = "ox_orch.cli:cli"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-caps>=0.0.3",
    "ipython>=9.14.0",
    "pre-commit>=4.6.0",
    "pyjwt>=2.15.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    # "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "python-magic>=0.4.27",
    "ruff>=0.15.15",
]
docs = [
    "autodoc-pydantic>=2.2.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.10.4",
    "sphinx-rtd-theme>=3.1.0",
]
django = [
    "django>=5.0",
    "djangorestframework>=3.10",
]

[tool.setuptools]
packages = ["ox_orch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ox_orch"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.black]
line-length = 120
exclude = '''
    /(
          \.egg
        | \.git
        | \.hg
        | \.tox
        | \._build
        | \.build
        | \.bulk-out
        | \.dist
        | \.__pycache__
        | \.venv
        | \.migrations
        | \.static
        | \.ox/settings
        | \.scripts
    )
'''


[tool.ruff]
line-length = 120
exclude = [
    "egg",
    "git",
    "hg",
    "tox",
    "_build",
    "build",
    "dist",
    "__pycache__",
    "venv",
    "*/migrations",
    "static",
    "ox/settings",
    "scripts/",
]


[tool.semantic_release]
version_variables = ["django_installer/__init__.py:__version__"]
version_toml = [
    "pyproject.toml:tool.poetry.version",
]
